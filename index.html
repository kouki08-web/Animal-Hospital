<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑石きたむら動物病院</title>
    <meta name="description" content="滑石きたむら動物病院の公式サイトです。">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="container"></div>

    <!-- header -->
    <header class="header">
        <div class="inner">
            <h1 class="header__logo">
                <a href="#">
                    <img src="./images/paws-01.jpg" alt="肉球" class="header__logo-icon">
                    滑石きたむら動物病院
                </a>
            </h1>
            <nav class="header__nav pc">
                <ul>
                    <li>
                        <a href="#greeting">ご挨拶</a>
                    </li>
                    <li>
                        <a href="#strength">強み</a>
                    </li>
                    <li>
                        <a href="#service">サービス</a>
                    </li>
                    <li>
                        <a href="#news">お知らせ</a>
                    </li>
                    <li>
                        <a href="#access">アクセス</a>
                    </li>
                    <li>
                        <a href="#contact">お問い合わせ</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <!-- main -->
    <main class="main">
        <!-- mv -->
        <section class="mv">
            <div class="mv__image">
                <picture>
                    <source media="(min-width: 768px)" srcset="./images/mv-pc.jpg">
                    <img src="./images/mv-sp.jpg" alt="">
                </picture>
            </div>
            <div class="mv__contents">
                <div class="mv__catch">
                    <h1>滑石きたむら動物病院は</h1>
                    <h2>大切な家族の<br>ホームドクターです</h2>
                </div>
            </div>
        </section>
        <!-- greeting -->
        <section class="greeting">
            <img src="./images/paws-02.jpg" alt="" class="bg-paws">
            <div class="inner">
                <h1>動物たちの健康で幸せな生活をサポート</h1>
                <p>当院は地域に密着し、皆さまの大切な家族の一員である動物たちのホームドクターを目指しています。<br>緊急時だけではなく、日常のちょっとした不安や違和感などお気軽にご相談ください。<br>動物たちが健康で幸せな生活を送ることができるようサポートいたします。</p>
            </div> 
        </section>


    </main>
    <!-- footer -->
    <footer class="footer">
        
    </footer>
</body>
</html>
